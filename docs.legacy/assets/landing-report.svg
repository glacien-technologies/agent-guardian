<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="AgentGuardian audit evidence report sample">
  <!-- AgentGuardian audit evidence report — sample panel, faithful to the marketing site
       Audit Evidence Report DOM (agent_guardian_web/app/page.tsx:1226 onwards).
       This is illustrative; replace with a real captured PNG from `agent-guardian report SCAN_ID --output pdf`
       once the v1.0 public sample scan is published. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0a17"/>
      <stop offset="1" stop-color="#13101f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1530"/>
      <stop offset="1" stop-color="#15102a"/>
    </linearGradient>
    <path id="ag-arc" d="M600,540 m-90,0 a90,90 0 1,1 180,0 a90,90 0 1,1 -180,0"/>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- panel -->
  <rect x="180" y="60" width="840" height="680" rx="22" fill="url(#panel)" stroke="#2a2147" stroke-width="1.5"/>

  <!-- header -->
  <text x="220" y="130" font-family="Inter, -apple-system, sans-serif" font-size="34" font-weight="600" fill="#e7e1ff">Audit Evidence Report</text>
  <text x="220" y="166" font-family="Inter, -apple-system, sans-serif" font-size="18" fill="#9a8fc4">orders-estate · 2026-05-29</text>
  <rect x="820" y="100" width="170" height="42" rx="10" fill="#26204a" stroke="#3d3370" stroke-width="1"/>
  <text x="905" y="129" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#cdc1ff" text-anchor="middle">AG-EV-7741</text>

  <line x1="220" y1="200" x2="980" y2="200" stroke="#2a2147" stroke-width="1"/>

  <!-- rows -->
  <g font-family="Inter, -apple-system, sans-serif" font-size="20">
    <text x="220" y="260" fill="#9a8fc4">agents audited</text>
    <text x="980" y="260" fill="#e7e1ff" text-anchor="end" font-weight="600">8 / 8</text>

    <text x="220" y="320" fill="#9a8fc4">vulnerable · gated</text>
    <text x="980" y="320" fill="#ff8a8a" text-anchor="end" font-weight="600">2 / 2</text>

    <text x="220" y="380" fill="#9a8fc4">fleet AIVSS</text>
    <text x="980" y="380" fill="#ffc46b" text-anchor="end" font-weight="600">67 / 100</text>

    <text x="220" y="440" fill="#9a8fc4">frameworks</text>
    <text x="980" y="440" fill="#e7e1ff" text-anchor="end" font-weight="600">MAS · APRA · HKMA · EU AI Act</text>
  </g>

  <line x1="220" y1="480" x2="980" y2="480" stroke="#2a2147" stroke-width="1"/>

  <!-- hash row -->
  <text x="220" y="520" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#9a8fc4">
    sha256 <tspan fill="#b8a8ff">4a7c91e2…b8190d3f</tspan>
  </text>
  <text x="980" y="520" font-family="Inter, -apple-system, sans-serif" font-size="15" fill="#6b6190" text-anchor="end">2026-05-29</text>

  <!-- signed stamp -->
  <g transform="translate(0,0)">
    <circle cx="600" cy="640" r="74" fill="none" stroke="#3d3370" stroke-width="1"/>
    <circle cx="600" cy="640" r="58" fill="#1a1530" stroke="#5a4ba8" stroke-width="1.5"/>
    <path d="M572 642 l16 16 L632 624" fill="none" stroke="#a18bff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#9a8fc4" letter-spacing="2">
      <textPath href="#ag-arc" startOffset="0%">SIGNED · AUDITOR-VERIFIABLE · SIGNED · AUDITOR-VERIFIABLE ·</textPath>
    </text>
  </g>

  <!-- footer caption -->
  <text x="600" y="772" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#6b6190" text-anchor="middle">
    Sample evidence pack — generated by `agent-guardian report SCAN_ID --output pdf`. Real reports are signed with Ed25519 + HMAC-SHA256.
  </text>
</svg>
