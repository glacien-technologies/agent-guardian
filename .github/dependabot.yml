# Standard §4.5 / §12.7 — automated dependency updates for pip,
# github-actions, and docker. Minor/patch grouped to reduce PR noise;
# major bumps land as separate PRs so they get explicit review.

version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 8
    reviewers:
      - glacien-technologies/oss-maintainers
    labels:
      - dependencies
      - python
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(python)"
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    reviewers:
      - glacien-technologies/oss-maintainers
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(actions)"
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 3
    reviewers:
      - glacien-technologies/oss-maintainers
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "deps(docker)"
      include: scope
