name: Brand integrity

# Standard §12.6 — enforce that every commit on ``main`` carries a
# ``@glacien.ai`` author email. Contributor pull requests authored from
# personal email addresses are permitted; they get squash-merged with a
# Glacien-email committer, which produces the single canonical commit on
# ``main`` that this check inspects.
#
# Purpose: keeps the public git history consistent with the project's
# corporate-backed governance story documented in governance.md.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-author-emails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect commit author emails since the previous main
        run: |
          set -eu
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          # First push to a fresh branch yields BEFORE = 000...; fall back
          # to the merge-base with the prior HEAD so we don't scan the
          # entire history.
          if [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          fi

          BAD=$(git log --format='%H %ae' "${BEFORE}..${AFTER}" \
            | awk '$2 !~ /@glacien\.ai$/ {print}')

          if [ -n "${BAD}" ]; then
            echo "::error::Non-Glacien commit authors detected on main:"
            echo "${BAD}" | while read -r line; do
              echo "::error::  ${line}"
            done
            echo
            echo "Resolution: squash-merge contributor PRs so the resulting"
            echo "commit on main carries a maintainer's @glacien.ai email."
            exit 1
          fi

          echo "All commits in ${BEFORE}..${AFTER} pass the brand-integrity check."
