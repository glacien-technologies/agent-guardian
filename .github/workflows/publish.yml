name: Publish to PyPI

# Standard §4.3 / §4.4 / §4.8 / §12.2.
#
# Sequence on every ``v*.*.*`` tag:
#   1. Build sdist + wheel reproducibly.
#   2. Generate a CycloneDX SBOM for the locked dependency tree.
#   3. Sign every artifact with Sigstore (keyless OIDC via Fulcio + Rekor).
#   4. Generate GitHub artifact attestations for wheel, sdist, and SBOM provenance.
#   5. Attach SBOM + signatures + wheels to the GitHub Release.
#   6. Publish to PyPI via Trusted Publishing (OIDC; no API tokens).
#
# Failure of ANY step halts the release — no half-published versions.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build wheel + sdist + SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0  # full history for SOURCE_DATE_EPOCH derivation

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true

      - name: Set SOURCE_DATE_EPOCH for reproducible builds
        # Standard §4.12 — derive from commit timestamp so the build is
        # bit-identical across re-runs.
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV

      - name: Build wheel + sdist
        run: uv build

      - name: Install runtime deps for SBOM
        # cyclonedx-py needs the project installed to traverse its
        # dependency tree accurately.
        run: |
          uv sync --frozen
          uv pip install cyclonedx-bom

      - name: Generate CycloneDX SBOM
        # Standard §4.8 — SBOM in CycloneDX format attached to every release.
        run: |
          uv run cyclonedx-py environment \
            --output-format json \
            --output-file dist/agent-guardian.cdx.json
          ls -la dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist
          path: dist/

  sign:
    name: Sigstore-sign and attest artifacts
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC token for keyless Sigstore signing
      attestations: write  # GitHub artifact attestations for release provenance
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Sign wheel + sdist + SBOM with Sigstore
        # Standard §4.3 — keyless signing via Sigstore (Fulcio short-lived
        # certs + Rekor transparency log). Anyone can verify with
        # ``sigstore verify`` against the published workflow identity.
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1  # v3.4.0
        with:
          inputs: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.cdx.json

      - name: Attest release artifact provenance
        # OpenSSF Scorecard Signed-Releases recognises GitHub artifact
        # attestations. Keep this alongside Sigstore signatures and PyPI
        # PEP 740 attestations so future releases carry verifiable provenance
        # at GitHub, PyPI, and standalone artifact levels.
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: signed-dist
          path: dist/

  release:
    name: Attach to GitHub Release
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create / update Releases
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: signed-dist
          path: dist/

      - name: Create or update GitHub Release with signed artifacts
        # Attach every file (wheel, sdist, SBOM, .sigstore signatures)
        # to the Release for the tag that triggered this run.
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.cdx.json
            dist/*.sigstore
            dist/*.sigstore.json
          generate_release_notes: true
          fail_on_unmatched_files: false

  publish:
    name: Publish to PyPI
    needs: sign
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-guardian
    permissions:
      id-token: write  # OIDC for Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: signed-dist
          path: dist/

      - name: Strip non-distribution files before upload
        # PyPI only accepts wheels + sdists. Sigstore .sigstore files
        # and the SBOM go to the GitHub Release, not to PyPI.
        run: |
          mkdir -p dist-upload
          cp dist/*.whl dist-upload/ 2>/dev/null || true
          cp dist/*.tar.gz dist-upload/ 2>/dev/null || true
          ls -la dist-upload/

      - name: Publish via Trusted Publishing
        # Standard §4.4 — OIDC, no PYPI_API_TOKEN secret involved.
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
        with:
          packages-dir: dist-upload/
          attestations: true  # PEP 740 attestations attached to PyPI

  notify:
    name: Notify Slack
    needs: [release, publish]
    runs-on: ubuntu-latest
    # Only when the whole release pipeline succeeded. Skips cleanly (the step
    # guard below) when no SLACK_WEBHOOK_URL secret is configured, so forks and
    # secret-less environments are never blocked.
    if: success()
    steps:
      - name: Post release notification to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          # Block Kit payload built in Python (json.dumps escaping; trusted env
          # vars only — the tag and repo are GitHub-provided).
          payload=$(python3 - <<'PY'
          import json, os
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          name = repo.split("/")[-1]
          url = f"https://github.com/{repo}/releases/tag/{tag}"
          blocks = [
              {"type": "section", "text": {"type": "mrkdwn",
               "text": f":rocket: *<{url}|{name} {tag}>* released"}},
              {"type": "context", "elements": [{"type": "mrkdwn",
               "text": "PyPI · GHCR · signed GitHub Release"}]},
          ]
          print(json.dumps({"text": f"{name} {tag} released", "blocks": blocks}))
          PY
          )
          curl -fsS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
