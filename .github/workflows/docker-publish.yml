name: Publish container to GHCR

# Standard §4.4 / §4.5 — every ``v*.*.*`` tag publishes a multi-arch
# (linux/amd64, linux/arm64) container image to GitHub Container
# Registry. The image is tagged with both the exact release tag (e.g.
# ``v1.0.0``) and ``latest``. Each published image also receives a
# Sigstore-backed GitHub provenance attestation tied to the pushed digest.
#
# Pull pattern after publish:
#   docker run --rm ghcr.io/glacien-technologies/agent-guardian:latest doctor
#
# Auth uses the workflow-scoped GITHUB_TOKEN. No long-lived PAT secret
# is involved, which keeps the credential blast radius small if the
# repo is ever compromised.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up QEMU
        # Required to cross-build the arm64 layer on the amd64 runner.
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference (lowercase repo)
        id: ref
        # GHCR requires the image path to be lowercase. ``github.repository``
        # preserves case; downcase it explicitly so tags like
        # ``Glacien-Technologies/agent-guardian`` still publish cleanly.
        run: |
          repo="${{ github.repository }}"
          echo "image=ghcr.io/${repo,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.ref.outputs.image }}:${{ github.ref_name }}
            ${{ steps.ref.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest published image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-name: ${{ steps.ref.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Smoke test the published image
        # Pull the freshly-pushed amd64 variant and run ``doctor`` to
        # confirm the entrypoint resolves and the CLI imports cleanly.
        # Non-zero exit fails the workflow.
        run: |
          docker pull --platform linux/amd64 \
            "${{ steps.ref.outputs.image }}:${{ github.ref_name }}"
          docker run --rm --platform linux/amd64 \
            "${{ steps.ref.outputs.image }}:${{ github.ref_name }}" doctor
