name: examples-ci

on:
  pull_request:
    paths:
      - "examples/**"
      - ".github/workflows/examples-ci.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "examples/**"
      - ".github/workflows/examples-ci.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  validate-examples:
    name: Validate framework example targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install agent-guardian + example deps
        run: uv sync --extra examples --extra dev

      - name: Validate example targets
        env:
          AG_VALIDATE_BEDROCK: "0"
          AG_VALIDATE_VERTEX: "0"
        run: uv run python examples/ci/validate_examples.py
