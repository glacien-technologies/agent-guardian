name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run mypy src/agent_guardian
  test:
    # Cross-platform matrix so we catch path / encoding / signal
    # regressions on macOS and Windows before they hit real users.
    # WeasyPrint depends on native libpango / libcairo which are
    # painful to provision on the Windows runner — the Windows leg
    # installs the pure-Python ``pdf-fallback`` extra (ReportLab) and
    # the PDF emitter test skips the WeasyPrint path cleanly via
    # ``importlib.util.find_spec`` (see tests/unit/test_report_pdf.py).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      # ``--extra aws`` pulls in botocore so the Bedrock provider tests
      # (SigV4 signing, error mapping) can construct ``BedrockClient``.
      # Without it the test module errors at import time. On Windows we
      # additionally install ``pdf-fallback`` (ReportLab) in place of
      # the default ``full`` WeasyPrint path.
      # ``--extra otel`` pulls in the OpenTelemetry SDK so the gated obs tests
      # under tests/unit/test_obs_otel.py (active-path tracer + observer) and
      # the consumer-side tests in tests/unit/test_obs_consumer.py actually
      # execute. Without it ``pytest.importorskip("opentelemetry")`` skips the
      # whole active suite silently, which means a regression in the GenAI
      # span emission path slips through CI undetected (cluster fix item P2).
      - name: Install deps (Linux/macOS)
        if: runner.os != 'Windows'
        run: uv sync --extra dev --extra aws --extra otel
      - name: Install deps (Windows, pdf-fallback)
        if: runner.os == 'Windows'
        run: uv sync --extra dev --extra aws --extra otel --extra pdf-fallback
      - run: uv run pytest --cov=agent_guardian --cov-report=xml --cov-report=term --cov-fail-under=90
      - uses: codecov/codecov-action@v5
        # Standard §11.1 — single canonical Codecov upload. Gate on the
        # ubuntu / 3.11 leg so the cross-platform matrix doesn't
        # double-count coverage or race the Codecov upload token.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Inventory installed licenses
        run: uv run pip-licenses --format=plain --with-system | tee licenses.txt
      - name: Reject copyleft transitive dependencies
        run: |
          # pip-licenses exits non-zero (1) if any package matches one of the
          # forbidden licenses. The set below is the standard "strong copyleft"
          # roster — anything reciprocal that would taint a downstream
          # Apache-2.0 redistributor.
          uv run pip-licenses --fail-on="GPLv2;GPLv3;LGPLv2;LGPLv3;AGPLv3"

  # Standard §4.6 — SAST. Bandit catches Python-specific security
  # antipatterns; Semgrep catches cross-language patterns plus AI-security
  # rules. High-severity findings block the merge; medium are surfaced as
  # PR annotations.
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Run bandit (Python SAST)
        # ``-ll`` = report low+, ``-iii`` = high-confidence only.
        # The build fails on any high-severity, high-confidence finding.
        run: uv run bandit -r src/agent_guardian -ll -iii
      - name: Run semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/default
            p/python
            p/security-audit
            p/owasp-top-ten
        env:
          # Semgrep CLI exits 1 on findings; we let it surface annotations
          # without blocking the PR until the rule set has been tuned.
          SEMGREP_TIMEOUT: "60"

  # Standard §3.6 — secret scanning on every push. Layered with GitHub
  # native secret scanning (enabled at the repository level once the repo
  # goes public — see docs/operator-checklist.md item §1.x).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs full history to scan
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
