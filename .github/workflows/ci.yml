name: CI
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
permissions:
  contents: read

# Cost-control notes (2026-06-12).
#
# GitHub-hosted runner billing model (Org Free plan, confirmed against
# the official docs at https://docs.github.com/en/billing/managing-billing-for-github-actions):
#
#   * Linux (`ubuntu-*`) on a PUBLIC repo is genuinely free — there is no
#     shared minute pool, no cap, no cross-charge to the org's allowance.
#     We can run as many Linux jobs as we want here without affecting the
#     14 private repos under glacien-technologies.
#
#   * macOS (`macos-*`) is classified as a "larger runner" and is ALWAYS
#     charged, even for public repositories. macOS minutes consume the
#     org-level allowance shared with every private repo on the org.
#     One stuck CI run alone (e.g. PR #151's 6-hour deadlock × 3 jobs
#     × 10x multiplier) can burn the entire monthly Free-plan budget.
#
# Concrete policy applied in this file:
#   1. The per-PR test matrix is ubuntu-only. macOS testing moved to a
#      separate `test-macos` job that runs only on release tag pushes
#      (`refs/tags/v*.*.*`) — we still get macOS coverage before
#      shipping to PyPI, just not on every PR.
#   2. Every job has `timeout-minutes`. A runaway test must die in 30
#      minutes, not 360, so a single mistake can't burn ~3,600
#      macOS-billing-minutes the way PR #151 nearly did.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
  type:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run mypy src/agent_guardian
  test:
    # Per-PR test matrix: ubuntu only across all supported Python versions.
    # Windows is tracked as v1.1 (Guardian backlog QA-038): the framework
    # relies on POSIX-shaped fixture paths, asyncio subprocess teardown,
    # and SO_REUSEADDR semantics that differ on Windows. Python 3.10 is
    # dropped: it has a known asyncio subprocess teardown bug
    # (BaseSubprocessTransport.__del__ runs after the loop is closed)
    # that was fixed in 3.11. ``pyproject.toml`` declares
    # ``requires-python = ">=3.11"`` to match.
    #
    # macOS testing now runs in the separate ``test-macos`` job below,
    # only on release-tag pushes — see the header comment for the
    # cost rationale.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      # ``--extra aws`` pulls in botocore so the Bedrock provider tests
      # (SigV4 signing, error mapping) can construct ``BedrockClient``.
      # Without it the test module errors at import time.
      # ``--extra otel`` pulls in the OpenTelemetry SDK so the gated obs tests
      # under tests/unit/test_obs_otel.py (active-path tracer + observer) and
      # the consumer-side tests in tests/unit/test_obs_consumer.py actually
      # execute. Without it ``pytest.importorskip("opentelemetry")`` skips the
      # whole active suite silently, which means a regression in the GenAI
      # span emission path slips through CI undetected (cluster fix item P2).
      - name: Install deps
        run: uv sync --extra dev --extra aws --extra otel
      - run: uv run pytest --cov=agent_guardian --cov-report=xml --cov-report=term --cov-fail-under=90
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v6
        # Standard §11.1 — single canonical Codecov upload. Gate on the
        # 3.11 leg so the cross-version matrix doesn't double-count
        # coverage or race the Codecov upload token.
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # macOS smoke test — runs ONLY on release tag pushes (``v*.*.*``).
  # Per-PR macOS coverage was removed in favour of running this on the
  # release commit so the cross-platform contract is still verified
  # before each PyPI publish, without burning the org's monthly macOS
  # allowance on every iterative PR. One run per release tag instead
  # of three runs per PR is a ~30x reduction in billed macOS minutes
  # on a typical week (5 PRs → 1 release).
  test-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - name: Install deps
        run: uv sync --extra dev --extra aws --extra otel
      - run: uv run pytest --cov=agent_guardian --cov-report=term --cov-fail-under=90
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Inventory installed licenses
        run: uv run pip-licenses --format=plain --with-system | tee licenses.txt
      - name: Reject copyleft transitive dependencies
        run: |
          # pip-licenses exits non-zero (1) if any package matches one of the
          # forbidden licenses. The set below is the standard "strong copyleft"
          # roster — anything reciprocal that would taint a downstream
          # Apache-2.0 redistributor.
          uv run pip-licenses --fail-on="GPLv2;GPLv3;LGPLv2;LGPLv3;AGPLv3"

  # Standard §4.6 — SAST. Bandit catches Python-specific security
  # antipatterns and remains blocking for high-confidence findings. Semgrep
  # catches cross-language patterns plus AI-security rules and currently
  # surfaces annotations without blocking until the repository-wide rule set
  # is tuned against the existing dashboard/reporting code.
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Run bandit (Python SAST)
        # ``-ll`` = report low+, ``-iii`` = high-confidence only.
        # The build fails on any high-severity, high-confidence finding.
        run: uv run bandit -r src/agent_guardian -ll -iii
      - name: Run semgrep
        continue-on-error: true
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d  # v1
        with:
          config: >-
            p/default
            p/python
            p/security-audit
            p/owasp-top-ten
        env:
          # Semgrep CLI exits 1 on findings; we let it surface annotations
          # without blocking the PR until the rule set has been tuned.
          SEMGREP_TIMEOUT: "60"

  # Standard §3.6 — secret scanning on every push. Layered with GitHub
  # native secret scanning (enabled at the repository level once the repo
  # goes public — see docs/operator-checklist.md item §1.x).
  #
  # NOTE: we invoke the open-source ``gitleaks`` binary directly instead of
  # the ``gitleaks/gitleaks-action@v2`` wrapper. The wrapper requires a paid
  # ``GITLEAKS_LICENSE`` secret for organization-owned repos (per the
  # gitleaks-action breaking change), which fails closed on every PR
  # regardless of leak status. The OSS binary is unchanged in scan behaviour;
  # repo-root ``.gitleaksignore`` carries fingerprints for pre-existing
  # benign test fixtures.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0  # gitleaks needs full history to scan
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
      - name: Run gitleaks
        run: gitleaks detect --source . --no-banner --redact --verbose
