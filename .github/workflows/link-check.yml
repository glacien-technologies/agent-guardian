name: Link check

# Standard §11.1 — verify every external link in README.md and the
# ``docs/`` tree resolves. We use lychee because it is fast (Rust,
# concurrent) and ships an off-the-shelf GitHub Action.
#
# A non-2xx (including 4xx / 5xx) response on any link fails the
# workflow. This is intentionally strict: a broken link in onboarding
# docs is a direct hit to the "first ten minutes" UX target.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly drift detection — catches external pages that go 404
    # after merge.
    - cron: "17 5 * * 1"

permissions:
  contents: read
  issues: write  # required by lychee-action to file the drift issue on cron

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Run lychee link checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2
        with:
          # ``--no-progress`` keeps the CI log small; ``--max-concurrency 4``
          # avoids the 429s shields.io issues on bursty fan-out. We pass
          # the explicit file globs rather than relying on lychee's
          # auto-discovery so the matrix stays predictable.
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200,203,204,206,429
            README.md
            'docs/**/*.md'
          # Drift issue is only useful on the scheduled run; suppress
          # otherwise so PRs aren't spammed.
          fail: true
          format: markdown
