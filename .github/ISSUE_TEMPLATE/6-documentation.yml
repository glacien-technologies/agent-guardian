name: Documentation
description: Report a docs bug or request a docs improvement
title: "[docs] "
labels: ["documentation", "triage"]
body:
  - type: input
    id: page
    attributes:
      label: Page URL or repo path
      placeholder: "https://agentguardian.io/quickstart  OR  docs/adapters/langgraph.md"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of issue
      options:
        - Inaccurate / out of date
        - Missing information
        - Confusing wording
        - Broken link
        - Code example does not work
        - Other
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: What is wrong / what should it say?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix (optional)
