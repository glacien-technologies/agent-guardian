# Keep the public issue tracker focused on actionable work.
# Questions, early ideas, and vulnerability reports have dedicated routes.
blank_issues_enabled: false
contact_links:
  - name: Usage question or troubleshooting
    url: https://github.com/glacien-technologies/agent-guardian/discussions/categories/q-a
    about: Ask how to use AgentGuardian or troubleshoot a setup.
  - name: Early idea or roadmap discussion
    url: https://github.com/glacien-technologies/agent-guardian/discussions/categories/ideas
    about: Discuss open-ended ideas before they become tracked feature requests.
  - name: Report a security vulnerability
    url: https://github.com/glacien-technologies/agent-guardian/security/advisories/new
    about: Use the private advisory flow. Do not open a public issue for exploitable vulnerabilities.
