name: Probe request
description: Propose a new attack probe (or extension of an existing one)
title: "[probe] "
labels: ["attack-probe", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a new probe. Probes must target a documented failure mode and be
        reproducible against the stub target or a synthetic fixture. See [ETHICS.md](../ETHICS.md).
  - type: input
    id: probe-name
    attributes:
      label: Proposed probe name
      placeholder: "tool_abuse_argument_smuggle_v2"
    validations:
      required: true
  - type: dropdown
    id: asi-category
    attributes:
      label: OWASP ASI 2026 category
      options:
        - ASI01 - Memory Poisoning
        - ASI02 - Tool Misuse
        - ASI03 - Privilege Compromise
        - ASI04 - Resource Overload
        - ASI05 - Cascading Hallucination
        - ASI06 - Intent Breaking & Goal Manipulation
        - ASI07 - Misaligned Behaviours
        - ASI08 - Repudiation & Untraceability
        - ASI09 - Identity Spoofing & Impersonation
        - ASI10 - Overwhelming Human Oversight
        - Other / unsure
    validations:
      required: true
  - type: input
    id: atlas-technique
    attributes:
      label: MITRE ATLAS technique ID (if known)
      placeholder: "AML.T0051"
  - type: textarea
    id: failure-mode
    attributes:
      label: Failure mode being probed
      description: What does the agent do wrong? What does success look like for the attacker?
    validations:
      required: true
  - type: textarea
    id: attack-sketch
    attributes:
      label: Attack sketch
      description: Prompt(s), tool calls, or sequence of turns that you expect to elicit the failure.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: scoring
    attributes:
      label: How should success be scored?
      description: Deterministic check, judge LLM rubric, output substring, tool-call assertion, etc.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References / prior art
      description: Papers, blog posts, CVEs, advisory writeups.
  - type: checkboxes
    id: ethics
    attributes:
      label: Ethics confirmation
      options:
        - label: This probe does not embed a live exploit against a specific third-party production system.
          required: true
        - label: This probe is reproducible against the stub target or a synthetic fixture.
          required: true
