repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        # The 500 KB cap is intentional — every committed image/PDF in
        # the repo sits well under it. Exceptions live here, named
        # explicitly so a future accidental large binary still gets
        # caught:
        #   * uv.lock — deterministic dep lockfile, grows over time.
        #   * agentguardian-demo.gif — README hero asset (~6 MB); a
        #     decent-quality demo of the launch render does not fit
        #     under 500 KB. Replace, don't bypass for other files.
        exclude: ^(uv\.lock|docs/images/agentguardian-demo\.gif)$
      - id: detect-private-key
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^src/
        # mypy hook runs in an isolated venv; list runtime imports used in src/
        additional_dependencies:
          - pydantic>=2.9
          - types-PyYAML
          - typer>=0.15
          - httpx>=0.28
          - structlog>=24.4
          - fastapi>=0.115
          - jinja2>=3.1
