# Golden: a contract that inlines a RAW credential into auth.value instead of
# a ${backend:key} pointer. The SecretRef validator must reject this,
# surfacing as ContractValidationError at load time.
version: 1
target:
  name: leaky-gateway
  environment: staging
  transport:
    kind: http
    url: https://api.acme.example.com/v1/chat
  auth:
    kind: api_key
    in: header
    value: sk-ant-rawtoken-do-not-do-this-1234567890
  response:
    output_path: $.output.text
