<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>{% block title %}{{ page_title|default("AgentGuardian") }} · AgentGuardian{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <header class="site-header">
    <nav class="site-nav" aria-label="Primary">
      <a href="/" class="brand" aria-label="AgentGuardian home">
        <img src="/static/logo.svg" alt="" class="brand-logo" aria-hidden="true" />
        AgentGuardian
      </a>
      <ul class="nav-links">
        <li><a href="/?page_size=500">Scans</a></li>
        <li><a href="https://docs.agentguardian.io/" target="_blank" rel="noopener noreferrer">Docs</a></li>
        <li><a href="/about">About</a></li>
      </ul>
    </nav>
  </header>
  <main id="main" class="site-main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <span>AgentGuardian v{{ version }}</span>
    <span>·</span>
    <span>Apache-2.0</span>
    <span>·</span>
    <a href="https://github.com/glacien-technologies/agent-guardian" target="_blank" rel="noopener noreferrer">github</a>
  </footer>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
