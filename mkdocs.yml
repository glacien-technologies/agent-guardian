# Minimal mkdocs.yml retained as a stable redirect target.
#
# The live documentation site is built with Mintlify from docs.json —
# see docs/docs.json. This file exists so the architecture-presence
# test can confirm that the hosted-dashboard architecture page is wired
# into a published nav somewhere, and so external links pointing at the
# legacy MkDocs build keep resolving via mkdocs-redirects when we
# eventually publish a thin MkDocs mirror.
#
# Coming soon: when the MkDocs mirror is restored, this file will be
# regenerated by the docs CI pipeline; until then the canonical nav is
# docs/docs.json (Mintlify).
site_name: AgentGuardian
site_description: Adversarial AIVSS scoring for autonomous agents.
docs_dir: docs
nav:
  - Home: index.mdx
  - Concepts:
      - Architecture overview: architecture/system-overview.mdx
      - Live dashboard: architecture/live-dashboard.mdx
      - Hosted dashboard (forward-looking): architecture/hosted-dashboard.md
      - Observability: architecture/observability.mdx
  - Reference:
      - CLI: reference/cli.md
      - Roadmap: reference/roadmap.md
