site_name: AgentGuardian
site_url: https://agentguardian.io/docs/
use_directory_urls: false
site_description: First open-source adversarial-swarm framework for agentic AI red-teaming.
site_author: Glacien Pte. Ltd.
copyright: Copyright &copy; 2026 Glacien Pte. Ltd. Apache-2.0.

exclude_docs: |
  launch-manual-blockers.md
  scan-flow-explainer.html
  _glossary-abbreviations.md
  _design/

repo_url: https://github.com/glacien-technologies/agent-guardian
repo_name: glacien-technologies/agent-guardian
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - search.highlight
    - search.suggest
  icon:
    logo: material/shield-search
    repo: fontawesome/brands/github

plugins:
  - search
  - redirects:
      redirect_maps:
        quickstart.md: tutorials/quickstart.md
        getting-started/first-scan.md: tutorials/first-scan.md
        cli.md: reference/cli.md
        architecture.md: concepts/architecture.md
        aivss-formula.md: concepts/aivss.md
        glossary.md: concepts/glossary.md
        why.md: concepts/why.md
        roadmap.md: reference/roadmap.md
        arxiv-preprint.md: research/preprint.md
        faq.md: faq/index.md
        ethics.md: security/ethics.md
        api/index.md: reference/api/index.md
        api/cli.md: reference/api/cli.md
        api/core.md: reference/api/core.md
        api/models.md: reference/api/models.md
        api/adapters.md: reference/api/adapters.md
        adapters/index.md: integrations/adapters/index.md
        adapters/prompt.md: how-to/scan-a-system-prompt.md
        adapters/code.md: how-to/scan-python-source.md
        adapters/http.md: how-to/scan-an-http-endpoint.md
        adapters/framework.md: integrations/adapters/framework.md
        providers/index.md: integrations/providers/index.md
        providers/openai.md: integrations/providers/openai.md
        providers/anthropic.md: integrations/providers/anthropic.md
        providers/vertex.md: integrations/providers/vertex.md
        providers/bedrock.md: integrations/providers/bedrock.md
        providers/ollama.md: integrations/providers/ollama.md
        guide/configuration.md: operations/configuration.md
        guide/output-formats.md: reference/output-formats.md
        operator-checklist.md: contributing/operator-checklist.md
        publishing.md: contributing/releasing.md
        site-deployment.md: contributing/site-deployment.md
        engineering-standards.md: contributing/engineering-standards.md
        contributing.md: contributing/index.md
        telemetry/index.md: security/telemetry.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true

markdown_extensions:
  - abbr
  - admonition
  - codehilite
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [docs, .]
      check_paths: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md

  - Tutorials:
      - Quickstart: tutorials/quickstart.md
      - Your first scan: tutorials/first-scan.md
      - Add to your CI pipeline: tutorials/ci-gate.md

