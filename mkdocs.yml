      - Architecture: concepts/architecture.md
      - Hosted dashboard (forward-looking): architecture/hosted-dashboard.md
      - The swarm: concepts/swarm.md
      - AIVSS scoring: concepts/aivss.md
      - Probes: concepts/probes.md
      - Scan modes: concepts/scan-modes.md
      - Target tiers: concepts/tiers.md
      - Threat coverage (OWASP / MITRE / CSA): concepts/threat-coverage.md
