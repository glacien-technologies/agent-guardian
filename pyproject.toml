[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-guardian"
dynamic = ["version"]
description = "Adversarial swarm framework for agentic AI red-teaming. Eleven specialist agents, deterministic AIVSS score, OWASP ASI / MITRE ATLAS / CSA aligned."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Glacien Pte. Ltd.", email = "opensource@glacien.ai" }]
keywords = ["llm", "agent", "red-team", "security", "owasp", "mitre-atlas", "aivss", "agentic-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pydantic>=2.9",
  "rich>=13.9",
  "textual>=0.86",
  "typer>=0.15",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "structlog>=24.4",
  "cryptography>=43.0",
  "exceptiongroup>=1.2; python_version<'3.11'",
]

[project.optional-dependencies]
full = [
  "weasyprint>=63.0",
  "faiss-cpu>=1.9",
  "sentence-transformers>=3.3",
  "presidio-analyzer>=2.2",
]
pdf-fallback = ["reportlab>=4.2"]
# ``aws`` carries the optional botocore dependency that the production
# Bedrock client uses for the AWS credential chain + SigV4 request signer.
# It is intentionally NOT in base deps so users who never touch Bedrock
# don't pay the ~5 MB install cost. NOTE: this is bare ``botocore``, not
# full ``boto3`` (50 MB) or ``aioboto3`` (15 MB + asyncio layer) — we
# only need the credential resolution + SigV4 signing primitives; the
# actual HTTP transport is our existing ``httpx.AsyncClient`` (which
# already owns retry, sandbox, and concurrency-cap behaviour).
aws = [
  "botocore>=1.34",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.24",
]
# ``examples`` carries every dep used by the demo target agents under
# ``examples/`` (LangGraph + OpenAI Agents SDK trios). They are strictly
# opt-in so the runtime install of agent-guardian stays lean — the OSS
# scanner itself never imports these libraries. Installed via
# ``uv sync --extra examples`` (typically alongside ``--extra dev``).
examples = [
  "langgraph>=0.2",
  "langchain-google-genai>=2.0",
  "langchain-core>=0.3",
  "openai>=1.50",
  "openai-agents>=0.3",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "hypothesis>=6.115",
  "pre-commit>=4.0",
  "respx>=0.22",
  "pip-licenses>=5.0",
  # python-dotenv enables ``.env`` auto-loading from the cwd (see
  # ``cli._try_load_dotenv``). Dev-only by design: production users export
  # real environment variables; the dev extra is the path of least
  # friction for local hacking.
  "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://agentguardian.ai"
Documentation = "https://agentguardian.ai/docs"
Repository = "https://github.com/glacien-technologies/agent-guardian"
Issues = "https://github.com/glacien-technologies/agent-guardian/issues"
Changelog = "https://github.com/glacien-technologies/agent-guardian/blob/main/CHANGELOG.md"

[project.scripts]
agent-guardian = "agent_guardian.cli:app"

[tool.hatch.version]
path = "src/agent_guardian/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_guardian"]
# Make sure the bundled seed-probe corpus (M11) ships in the wheel — these
# globs cover the YAML probes plus the ``_meta/version.yaml`` stamp.
artifacts = [
  "src/agent_guardian/probes/**/*.yaml",
  "src/agent_guardian/probes/_meta/*.yaml",
  # M12 dashboard assets — templates and static files.
  "src/agent_guardian/server/templates/*.html",
  "src/agent_guardian/server/static/*.css",
  "src/agent_guardian/server/static/*.js",
  # M13 PDF report template (used by WeasyPrint) + embedded WOFF2 fonts
  # (Inter + JetBrains Mono, both SIL OFL — see NOTICE).
  "src/agent_guardian/reports/templates/pdf/*.jinja",
  "src/agent_guardian/reports/templates/pdf/fonts/*.woff2",
]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "NOTICE", "CITATION.cff"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer requires function-call defaults — they are the public API.
"src/agent_guardian/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["tests/"]

# botocore is an optional dependency (``[aws]`` extra) used only by
# ``agent_guardian.llm.bedrock`` for SigV4 signing + credential
# resolution. It ships no PEP-561 stubs, and the pre-commit mypy hook
# runs in an isolated venv where botocore is not installed at all —
# both cases produce noise we silence here once for the whole project.
[[tool.mypy.overrides]]
module = ["botocore.*"]
ignore_missing_imports = true

# sentence_transformers + numpy are optional via the ``[full]`` extra
# (used by the FAISS-backed scenario dedupe in
# :mod:`agent_guardian.agents.base` and the vector-search path in
# :mod:`agent_guardian.core.memory`). The imports live inside
# ``try/except ImportError`` blocks at runtime; mypy doesn't model the
# conditional install, so we silence the missing-stub noise here once.
[[tool.mypy.overrides]]
module = ["sentence_transformers", "numpy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# ``examples/`` is demo target code that calls real Gemini and is
# explicitly NOT a test surface (would cost money on every CI run).
# ``testpaths`` already restricts collection to ``tests/`` but
# ``norecursedirs`` adds defence-in-depth if anyone ever invokes
# ``pytest .`` ad-hoc. We include the pytest defaults explicitly
# (``.*``, ``CVS``, ``_darcs``, ``{arch}``, ``*.egg``, ``venv``, ``node_modules``)
# so we extend the ignore list rather than replacing it.
norecursedirs = [
  "examples",
  ".*",
  "*.egg",
  "_darcs",
  "{arch}",
  "CVS",
  "dist",
  "build",
  "site",
  "node_modules",
  "venv",
  ".venv",
]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/agent_guardian"]
branch = true

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260518",
]
