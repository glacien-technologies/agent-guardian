[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-guardian"
dynamic = ["version"]
description = "Adversarial swarm framework for agentic AI red-teaming. Eleven specialist agents, deterministic AIVSS score, OWASP ASI / MITRE ATLAS / CSA aligned."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Glacien Pte. Ltd.", email = "opensource@glacien.ai" }]
keywords = ["llm", "agent", "red-team", "security", "owasp", "mitre-atlas", "aivss", "agentic-ai"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pydantic>=2.9",
  "rich>=13.9",
  "textual>=0.86",
  "typer>=0.15",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "structlog>=24.4",
  "cryptography>=43.0",
  "exceptiongroup>=1.2; python_version<'3.11'",
]

[project.optional-dependencies]
full = [
  "weasyprint>=63.0",
  "faiss-cpu>=1.9",
  "sentence-transformers>=3.3",
  "presidio-analyzer>=2.2",
]
pdf-fallback = ["reportlab>=4.2"]
# ``aws`` carries the optional botocore dependency that the production
# Bedrock client uses for the AWS credential chain + SigV4 request signer.
# It is intentionally NOT in base deps so users who never touch Bedrock
# don't pay the ~5 MB install cost. NOTE: this is bare ``botocore``, not
# full ``boto3`` (50 MB) or ``aioboto3`` (15 MB + asyncio layer) — we
# only need the credential resolution + SigV4 signing primitives; the
# actual HTTP transport is our existing ``httpx.AsyncClient`` (which
# already owns retry, sandbox, and concurrency-cap behaviour).
aws = [
  "botocore>=1.34",
]
# ``gcp`` carries google-auth for the Vertex / GCP contract-auth providers
# (``gcp_adc`` Application Default Credentials, ``gcp_sa_json`` service-account
# JSON). Opt-in like ``aws``: the providers raise a clear ImportError with
# remediation when it is absent, so users who never scan a GCP target don't
# pay the install cost.
gcp = [
  "google-auth>=2.0",
]
# ``otel`` carries the OpenTelemetry stack used by the GenAI-observability
# module (:mod:`agent_guardian.obs`). It is strictly opt-in: the module
# degrades to a silent no-op when these packages are absent, so the default
# install never pays the dependency cost. The pinned floors track the first
# releases that carry the stable GenAI semantic-convention attribute names we
# emit (``gen_ai.*``); the experimental conventions are additionally gated
# behind the ``OTEL_SEMCONV_STABILITY_OPT_IN=gen_ai_latest_experimental`` env
# var at runtime.
otel = [
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-semantic-conventions>=0.48b0",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.24",
]
# ``examples`` carries every dep used by the demo target agents under
# ``examples/`` (LangGraph + OpenAI Agents SDK trios). They are strictly
# opt-in so the runtime install of agent-guardian stays lean — the OSS
# scanner itself never imports these libraries. Installed via
# ``uv sync --extra examples`` (typically alongside ``--extra dev``).
examples = [
  "langgraph>=0.2",
  "langchain-google-genai>=2.0",
  "langchain-core>=0.3",
  "openai>=1.50",
  "openai-agents>=0.3",
]
# ``ws`` carries the websockets client used by the ``websocket`` contract
# transport. It is strictly opt-in like ``aws`` / ``gcp``: the transport's
# import is guarded so users who never scan a WebSocket target don't pay the
# install cost, and the transport raises a clear ImportError with remediation
# when it is absent.
ws = [
  "websockets>=12.0",
]
# ``grpc`` carries grpcio for the ``grpc`` contract transport. Opt-in like
# ``ws``: the transport import is guarded, so the default install stays lean
# and only gRPC targets pull in the (larger) grpcio wheel.
grpc = [
  "grpcio>=1.60",
]
# ``browser`` carries Playwright for the ``browser`` contract transport, which
# drives a headless browser against a web UI. Strictly opt-in: Playwright also
# needs ``playwright install`` to fetch browser binaries, so it is never a base
# dependency; the transport import is guarded behind a clear ImportError.
browser = [
  "playwright>=1.40",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "hypothesis>=6.115",
  "pre-commit>=4.0",
  "respx>=0.22",
  "pip-licenses>=5.0",
  # Bandit — Python-specific SAST. Wired into ci.yml ``sast`` job. The
  # baseline ruleset catches eval/exec misuse, weak crypto choices, shell
  # injection, hardcoded credentials. High-severity, high-confidence
  # findings block the merge.
  "bandit>=1.7",
  # python-dotenv enables ``.env`` auto-loading from the cwd (see
  # ``cli._try_load_dotenv``). Dev-only by design: production users export
  # real environment variables; the dev extra is the path of least
  # friction for local hacking.
  "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://agentguardian.ai"
Documentation = "https://agentguardian.ai/docs"
Repository = "https://github.com/glacien-technologies/agent-guardian"
Issues = "https://github.com/glacien-technologies/agent-guardian/issues"
Changelog = "https://github.com/glacien-technologies/agent-guardian/blob/main/CHANGELOG.md"

[project.scripts]
agent-guardian = "agent_guardian.cli:app"

[tool.hatch.version]
path = "src/agent_guardian/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_guardian"]
# Make sure the bundled seed-probe corpus (M11) ships in the wheel — these
# globs cover the YAML probes plus the ``_meta/version.yaml`` stamp.
artifacts = [
  "src/agent_guardian/probes/**/*.yaml",
  "src/agent_guardian/probes/_meta/*.yaml",
  # M12 dashboard assets — templates and static files.
  "src/agent_guardian/server/templates/*.html",
  "src/agent_guardian/server/static/*.css",
  "src/agent_guardian/server/static/*.js",
  # M13 PDF report template (used by WeasyPrint) + embedded WOFF2 fonts
  # (Inter + JetBrains Mono, both SIL OFL — see NOTICE).
  "src/agent_guardian/reports/templates/pdf/*.jinja",
  "src/agent_guardian/reports/templates/pdf/fonts/*.woff2",
]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "NOTICE", "CITATION.cff"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer requires function-call defaults — they are the public API.
"src/agent_guardian/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["tests/"]

# botocore is an optional dependency (``[aws]`` extra) used only by
# ``agent_guardian.llm.bedrock`` for SigV4 signing + credential
# resolution. It ships no PEP-561 stubs, and the pre-commit mypy hook
# runs in an isolated venv where botocore is not installed at all —
# both cases produce noise we silence here once for the whole project.
[[tool.mypy.overrides]]
module = ["botocore.*"]
ignore_missing_imports = true

# sentence_transformers + numpy are optional via the ``[full]`` extra
# (used by the FAISS-backed scenario dedupe in
# :mod:`agent_guardian.agents.base` and the vector-search path in
# :mod:`agent_guardian.core.memory`). The imports live inside
# ``try/except ImportError`` blocks at runtime; mypy doesn't model the
# conditional install, so we silence the missing-stub noise here once.
[[tool.mypy.overrides]]
module = ["sentence_transformers", "numpy"]
ignore_missing_imports = true

# opentelemetry is an optional dependency (``[otel]`` extra) used only by
# :mod:`agent_guardian.obs`. Every import sits inside ``try/except ImportError``
# so the module no-ops when the SDK is absent. The pre-commit mypy hook runs in
# an isolated venv without the OTel packages, so we silence the missing-import
# noise here once for the whole project (precedent: ``botocore.*``).
[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true

# google-auth is an optional dependency (``[gcp]`` extra) used only by the
# Vertex / GCP contract-auth providers, behind import guards. Its type coverage
# is partial; silence the missing-import + partial-stub noise once for the whole
# project so mypy is identical whether or not ``[gcp]`` is installed (precedent:
# ``botocore.*``).
[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true
# google-auth ships only partial type stubs, so an installed copy makes mypy
# flag its untyped functions (no-untyped-call) while an absent copy makes any
# inline ignore unused — the two environments disagree. ``follow_imports=skip``
# treats google.* as ``Any`` whether or not it is installed, so mypy behaves
# identically in CI (no [gcp]) and locally (with [gcp]).
follow_imports = "skip"

# websockets / grpcio / playwright are optional dependencies (the ``[ws]``,
# ``[grpc]`` and ``[browser]`` extras) used only by the long-tail contract
# transports, all behind import guards. They ship partial / absent type stubs,
# and the pre-commit mypy hook runs in an isolated venv without them installed —
# both cases produce missing-import noise we silence here once for the whole
# project so mypy behaves identically whether or not the extras are installed
# (precedent: ``botocore.*`` / ``google.*`` / ``opentelemetry.*``). ``grpc`` is
# only ever imported top-level (``import grpc``; submodules such as ``grpc.aio``
# are reached via attribute access), so no ``grpc.*`` submodule pattern is used.
[[tool.mypy.overrides]]
module = ["websockets.*", "grpc", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# ``examples/`` is demo target code that calls real Gemini and is
# explicitly NOT a test surface (would cost money on every CI run).
# ``testpaths`` already restricts collection to ``tests/`` but
# ``norecursedirs`` adds defence-in-depth if anyone ever invokes
# ``pytest .`` ad-hoc. We include the pytest defaults explicitly
# (``.*``, ``CVS``, ``_darcs``, ``{arch}``, ``*.egg``, ``venv``, ``node_modules``)
# so we extend the ignore list rather than replacing it.
norecursedirs = [
  "examples",
  ".*",
  "*.egg",
  "_darcs",
  "{arch}",
  "CVS",
  "dist",
  "build",
  "site",
  "node_modules",
  "venv",
  ".venv",
]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/agent_guardian"]
branch = true

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260518",
]
