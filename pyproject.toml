[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-guardian"
dynamic = ["version"]
description = "Open-source red teaming toolkit for AI agents, RAG systems, MCP servers, and tool-using LLM applications."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Glacien Pte. Ltd.", email = "opensource@glacien.ai" }]
keywords = [
  "llm",
  "agent",
  "red-team",
  "security",
  "owasp",
  "mitre-atlas",
  "aivss",
  "agentic-ai",
  "prompt-injection",
  "jailbreak",
  "ai-safety",
  "ai-security",
  "llm-security",
  "genai-security",
  "sarif",
  "cybersecurity",
  "ai-red-team",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pydantic>=2.9",
  "rich>=13.9",
  "textual>=0.86",
  "typer>=0.15",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  # ``structlog`` is the default JSON-log renderer wired in
  # :mod:`agent_guardian.logging_setup` (``_configure_structlog_json``). The
  # module imports it inside ``try/except ImportError`` so the package still
  # boots if the dep is stripped, but the JSON-formatted ops-friendly logs the
  # dashboards and SIEM ingestion rely on need it present. Verified consumer
  # (see ``logging_setup.py:_configure_structlog_json``); regression-tested by
  # ``tests/test_packaging.py::test_structlog_is_not_a_ghost_runtime_dep``.
  "structlog>=24.4",
  "cryptography>=43.0",
  # jsonschema validates emitted SARIF logs against the bundled SARIF 2.1.0
  # schema (see reports.sarif._validate_sarif). Already arrives as a
  # transitive (mcp → jsonschema), but the SARIF writer is a first-class
  # consumer so we declare it directly to keep the contract explicit.
  "jsonschema>=4.21",
  "exceptiongroup>=1.2; python_version<'3.11'",
  # QA-010 — ``--output pdf`` is an advertised first-class flag and must work
  # after a stock ``pip install agent-guardian``. ReportLab is pure-Python
  # (~5 MB, Apache-2.0, no native compilation step), so it is safe as a
  # default runtime dependency. WeasyPrint stays in the ``[full]`` extra
  # for users who want the higher-fidelity HTML→PDF renderer (it requires
  # native ``libpango`` / ``libcairo`` libraries that are not on bare CI
  # runners). The PDF dispatcher in :mod:`agent_guardian.reports.pdf`
  # already prefers WeasyPrint → ReportLab; promoting ReportLab into base
  # only guarantees the fallback is always present.
  "reportlab>=4.2",
]

[project.optional-dependencies]
full = [
  "weasyprint>=63.0",
  "faiss-cpu>=1.9",
  "sentence-transformers>=3.3",
  "presidio-analyzer>=2.2",
]
# QA-010 deprecation alias — ReportLab is now in base. This extra is kept
# empty for one release so ``pip install 'agent-guardian[pdf-fallback]'``
# continues to resolve for users / scripts that still reference it.
# Scheduled for removal in v1.2. A best-effort deprecation banner is
# emitted from ``agent_guardian.__init__`` when the user's site-packages
# were resolved through this extra (via ``importlib.metadata``).
pdf-fallback = []
# ``aws`` carries the optional botocore dependency that the production
# Bedrock client uses for the AWS credential chain + SigV4 request signer.
# It is intentionally NOT in base deps so users who never touch Bedrock
# don't pay the ~5 MB install cost. NOTE: this is bare ``botocore``, not
# full ``boto3`` (50 MB) or ``aioboto3`` (15 MB + asyncio layer) — we
# only need the credential resolution + SigV4 signing primitives; the
# actual HTTP transport is our existing ``httpx.AsyncClient`` (which
# already owns retry, sandbox, and concurrency-cap behaviour).
aws = [
  "botocore>=1.34",
]
# ``gcp`` carries google-auth for the Vertex / GCP contract-auth providers
# (``gcp_adc`` Application Default Credentials, ``gcp_sa_json`` service-account
# JSON). Opt-in like ``aws``: the providers raise a clear ImportError with
# remediation when it is absent, so users who never scan a GCP target don't
# pay the install cost.
gcp = [
  "google-auth>=2.0",
]
# ``otel`` carries the OpenTelemetry stack used by the GenAI-observability
# module (:mod:`agent_guardian.obs`). It is strictly opt-in: the module
# degrades to a silent no-op when these packages are absent, so the default
# install never pays the dependency cost. The pinned floors track the first
# releases that carry the stable GenAI semantic-convention attribute names we
# emit (``gen_ai.*``); the experimental conventions are additionally gated
# behind the ``OTEL_SEMCONV_STABILITY_OPT_IN=gen_ai_latest_experimental`` env
# var at runtime.
otel = [
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-semantic-conventions>=0.48b0",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.24",
]
# ``examples`` carries every dep used by the demo target agents under
# ``examples/`` (LangGraph + OpenAI Agents SDK trios). They are strictly
# opt-in so the runtime install of agent-guardian stays lean — the OSS
# scanner itself never imports these libraries. Installed via
# ``uv sync --extra examples`` (typically alongside ``--extra dev``).
examples = [
  "langgraph>=0.2",
  "langchain-google-genai>=2.0",
  "langchain-core>=0.3",
  "openai>=1.50",
  "openai-agents>=0.3",
]
# ``examples-crewai`` is a sibling of ``examples`` — opt-in CrewAI for the
# CrewAI demo target under ``examples/crewai/``. Kept in its own extra so
# the LangGraph + OpenAI Agents trio stays independent of CrewAI's
# transitive dependency graph. Install via
# ``uv sync --extra examples --extra examples-crewai``.
#
# SECURITY HOLDING ACTION — CVE-2026-45829 / GHSA-f4j7-r4q5-qw2c
# ----------------------------------------------------------------
# chromadb (transitive via crewai) has a pre-auth code-injection CVE
# (CVSSv4 9.3, CWE-94). Vulnerable range: >=1.0.0,<=1.5.9. As of
# 2026-06-02 no patched chromadb release exists upstream — the latest
# published version (1.5.9) is still vulnerable, so an overlay pin like
# ``chromadb>1.5.9`` is unsatisfiable today and would break ``uv lock``.
#
# AgentGuardian itself never imports or runs chromadb. The CrewAI adapter
# at ``src/agent_guardian/adapters/framework/crewai.py`` is pure
# duck-typing (no ``import crewai``), and chromadb only lands in the
# install tree when a user explicitly runs
# ``uv sync --extra examples-crewai`` AND stands up a chromadb server.
# The default ``pip install agent-guardian`` install path is unaffected.
#
# When chroma-core ships a patched release, **uncomment the overlay
# below** and run ``uv lock --upgrade-package chromadb`` to pull it in
# without waiting on a crewai metadata bump. See SECURITY.md /
# ``docs/security/disclosure-history.md`` for the full risk narrative.
examples-crewai = [
  "crewai>=0.55",
  # "chromadb>=<patched>",  # un-pin once GHSA-f4j7-r4q5-qw2c is fixed
]
# ``ws`` carries the websockets client used by the ``websocket`` contract
# transport. It is strictly opt-in like ``aws`` / ``gcp``: the transport's
# import is guarded so users who never scan a WebSocket target don't pay the
# install cost, and the transport raises a clear ImportError with remediation
# when it is absent.
ws = [
  "websockets>=12.0",
]
# ``grpc`` carries grpcio for the ``grpc`` contract transport. Opt-in like
# ``ws``: the transport import is guarded, so the default install stays lean
# and only gRPC targets pull in the (larger) grpcio wheel.
grpc = [
  "grpcio>=1.60",
]
# ``browser`` carries Playwright for the ``browser`` contract transport, which
# drives a headless browser against a web UI. Strictly opt-in: Playwright also
# needs ``playwright install`` to fetch browser binaries, so it is never a base
# dependency; the transport import is guarded behind a clear ImportError.
browser = [
  "playwright>=1.40",
]
# ``agentdojo`` carries the upstream Debenedetti et al. 2024 benchmark package
# used by the AgentDojo adapter (Phase C, C3). Strictly opt-in: the adapter
# falls back to a tiny vendored smoke corpus when this extra is absent so the
# default install stays lean. Install for full leaderboard-comparable runs:
# ``pip install 'agent-guardian[agentdojo]'``.
agentdojo = [
  "agentdojo>=0.1",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "hypothesis>=6.115",
  "pre-commit>=4.0",
  "respx>=0.22",
  "pip-licenses>=5.0",
  # Bandit — Python-specific SAST. Wired into ci.yml ``sast`` job. The
  # baseline ruleset catches eval/exec misuse, weak crypto choices, shell
  # injection, hardcoded credentials. High-severity, high-confidence
  # findings block the merge.
  "bandit>=1.7",
  # python-dotenv enables ``.env`` auto-loading from the cwd (see
  # ``cli._try_load_dotenv``). Dev-only by design: production users export
  # real environment variables; the dev extra is the path of least
  # friction for local hacking.
  "python-dotenv>=1.0",
  # PyYAML type stubs — required for ``mypy --strict`` to type-check the
  # YAML probe loader and meta-version reader without ``Any`` blow-up.
  # Single-sourced here in the PEP 621 ``dev`` extra so ``pip install -e
  # '.[dev]'`` and ``uv sync --extra dev`` install an identical dev env;
  # the legacy PEP 735 ``[dependency-groups].dev`` table that used to also
  # declare this was deleted to remove the dual-source-of-truth.
  "types-pyyaml>=6.0.12.20260518",
  # tomllib backport for Python 3.10 — used by ``tests/test_packaging.py``
  # to parse ``pyproject.toml`` (stdlib ``tomllib`` is 3.11+ only). The
  # test gates the import on ``sys.version_info`` so this dep is a no-op
  # on 3.11+. Pinned here so the contract is explicit; without it the
  # py3.10 CI matrix leg fails collection with ``ModuleNotFoundError``.
  "tomli>=2.0; python_version<'3.11'",
]

[project.urls]
Homepage = "https://agentguardian.io"
Documentation = "https://docs.agentguardian.io"
Repository = "https://github.com/glacien-technologies/agent-guardian"
Issues = "https://github.com/glacien-technologies/agent-guardian/issues"
Changelog = "https://github.com/glacien-technologies/agent-guardian/blob/main/CHANGELOG.md"
Source = "https://github.com/glacien-technologies/agent-guardian"

[project.scripts]
agent-guardian = "agent_guardian.cli:app"

[tool.hatch.version]
path = "src/agent_guardian/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_guardian"]
# Make sure the bundled seed-probe corpus (M11) ships in the wheel — these
# globs cover the YAML probes plus the ``_meta/version.yaml`` stamp.
artifacts = [
  "src/agent_guardian/probes/**/*.yaml",
  "src/agent_guardian/probes/_meta/*.yaml",
  # M12 dashboard assets — templates and static files.
  "src/agent_guardian/server/templates/*.html",
  "src/agent_guardian/server/static/*.css",
  "src/agent_guardian/server/static/*.js",
  # M13 PDF report template (used by WeasyPrint) + embedded WOFF2 fonts
  # (Inter + JetBrains Mono, both SIL OFL — see NOTICE).
  "src/agent_guardian/reports/templates/pdf/*.jinja",
  "src/agent_guardian/reports/templates/pdf/fonts/*.woff2",
  # Bundled SARIF 2.1.0 JSON Schema used by reports.sarif._validate_sarif
  # for runtime contract validation of emitted SARIF logs.
  "src/agent_guardian/reports/sarif-2.1.0.schema.json",
  # PEP 561 marker — declared explicitly so a future hatchling default that
  # tightens non-.py inclusion cannot silently drop it. The empty file flips
  # on inline-annotation consumption for mypy/pyright in downstream projects,
  # which is the contract the ``Typing :: Typed`` classifier promises.
  "src/agent_guardian/py.typed",
]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "NOTICE", "CITATION.cff"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# E501: line-length is enforced by formatter rather than the linter.
# UP042: ``class X(str, Enum)`` is the public-API serialisation shape used
# across the codebase (Pydantic v2 round-trip + JSON dump rely on ``str``
# subclass identity and ``__str__`` returning ``self.value``). Migrating
# to ``enum.StrEnum`` changes ``str()`` and hashing semantics in subtle
# ways that ripple through telemetry envelopes, SARIF emission, and the
# YAML loader. Tracked as v1.1 portability sweep (Guardian backlog QA-039)
# — needs a coordinated migration + regression sweep of the 3311 tests
# before flipping. Ignoring here keeps rc3 shippable on Linux + macOS.
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Typer requires function-call defaults — they are the public API.
"src/agent_guardian/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["tests/"]

# boto3 + botocore are optional dependencies (``[aws]`` extra) used by
# ``agent_guardian.llm.bedrock`` (SigV4 signing + credential resolution)
# and by ``agent_guardian.llm.validation`` (boto3 client construction,
# guarded by a try/except ImportError). Neither ships PEP-561 stubs, and
# the pre-commit mypy hook runs in an isolated venv where they are not
# installed at all — both cases produce noise we silence here once for
# the whole project.
[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

# sentence_transformers + numpy are optional via the ``[full]`` extra
# (used by the FAISS-backed scenario dedupe in
# :mod:`agent_guardian.agents.base` and the vector-search path in
# :mod:`agent_guardian.core.memory`). The imports live inside
# ``try/except ImportError`` blocks at runtime; mypy doesn't model the
# conditional install, so we silence the missing-stub noise here once.
[[tool.mypy.overrides]]
module = ["sentence_transformers", "numpy"]
ignore_missing_imports = true

# opentelemetry is an optional dependency (``[otel]`` extra) used only by
# :mod:`agent_guardian.obs`. Every import sits inside ``try/except ImportError``
# so the module no-ops when the SDK is absent. The pre-commit mypy hook runs in
# an isolated venv without the OTel packages, so we silence the missing-import
# noise here once for the whole project (precedent: ``botocore.*``).
[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true

# google-auth is an optional dependency (``[gcp]`` extra) used only by the
# Vertex / GCP contract-auth providers, behind import guards. Its type coverage
# is partial; silence the missing-import + partial-stub noise once for the whole
# project so mypy is identical whether or not ``[gcp]`` is installed (precedent:
# ``botocore.*``).
[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true
# google-auth ships only partial type stubs, so an installed copy makes mypy
# flag its untyped functions (no-untyped-call) while an absent copy makes any
# inline ignore unused — the two environments disagree. ``follow_imports=skip``
# treats google.* as ``Any`` whether or not it is installed, so mypy behaves
# identically in CI (no [gcp]) and locally (with [gcp]).
follow_imports = "skip"

# websockets / grpcio / playwright are optional dependencies (the ``[ws]``,
# ``[grpc]`` and ``[browser]`` extras) used only by the long-tail contract
# transports, all behind import guards. They ship partial / absent type stubs,
# and the pre-commit mypy hook runs in an isolated venv without them installed —
# both cases produce missing-import noise we silence here once for the whole
# project so mypy behaves identically whether or not the extras are installed
# (precedent: ``botocore.*`` / ``google.*`` / ``opentelemetry.*``). ``grpc`` is
# only ever imported top-level (``import grpc``; submodules such as ``grpc.aio``
# are reached via attribute access), so no ``grpc.*`` submodule pattern is used.
[[tool.mypy.overrides]]
module = ["websockets.*", "grpc", "playwright.*"]
ignore_missing_imports = true

# agentdojo is an optional dependency (the ``[agentdojo]`` extra) used only by
# the AgentDojo benchmark adapter (Phase C, C3). The import sits inside a
# try/except so the adapter falls back to its vendored smoke corpus when the
# extra is absent. Silence the missing-import noise once for the whole project
# so mypy behaves identically whether or not the extra is installed
# (precedent: ``botocore.*`` / ``google.*`` / ``opentelemetry.*``).
[[tool.mypy.overrides]]
module = ["agentdojo.*"]
ignore_missing_imports = true

# jsonschema has incomplete first-party stubs and ships none of its own. We
# call only a tiny stable surface (Draft7Validator + ValidationError) from
# :mod:`agent_guardian.reports.sarif`, so the missing-import + Any-return
# noise is silenced once here rather than peppering inline ignores.
[[tool.mypy.overrides]]
module = ["jsonschema"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# ``examples/`` is demo target code that calls real Gemini and is
# explicitly NOT a test surface (would cost money on every CI run).
# ``testpaths`` already restricts collection to ``tests/`` but
# ``norecursedirs`` adds defence-in-depth if anyone ever invokes
# ``pytest .`` ad-hoc. We include the pytest defaults explicitly
# (``.*``, ``CVS``, ``_darcs``, ``{arch}``, ``*.egg``, ``venv``, ``node_modules``)
# so we extend the ignore list rather than replacing it.
norecursedirs = [
  "examples",
  ".*",
  "*.egg",
  "_darcs",
  "{arch}",
  "CVS",
  "dist",
  "build",
  "site",
  "node_modules",
  "venv",
  ".venv",
]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "phaseA: Phase A audit-tagged tests (sibling-strategy carryover, etc.)",
  "phaseB: Phase B audit-tagged tests (mutators, judges, seed store, sibling map, H-CoT, ATLAS enum)",
]

[tool.coverage.run]
source = ["src/agent_guardian"]
branch = true
